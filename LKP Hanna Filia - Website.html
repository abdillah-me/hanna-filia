  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

t);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2d2b2b 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.grayscale{filter:grayscale(1) contrast(1.08)}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 2px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); justify-content: flex-start; text-align: left; }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { mi x; margin: 0 0 6px; letter-spacing: -0.01em\">Conversation Class<\u002Fp>\n              <p style=\"margin: 0 0 12px; font-size: 15px; color: #8A7C74\">Umum, 15 tahun ke atas · 3 bulan, 2× seminggu<\u002Fp>\n              <p style=\"margin: 0; font-size: 16px; line-height: 1.55\">Percakapan tematik dan roleplay situasi nyata, dengan sesi bulanan bersama pengajar native speaker.<\u002Fp>\n            <\u002Fa>\n            <a href=\"#\" sc-camel-on-click=\"{{ goToefl }}\" style=\"border: 1.5px solid #1C1A19; border-radius: 4px; padding: 24px; display: block; color: #1C1A19; transition: background 0.18s ease, border-color 0.18s ease\" style-hover=\"border-color: #A21C42; background: #FDF4E9\">\n              <div style=\"display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 18px\">\n                <span style=\"font-family: Archivo, sans-serif; font-weight: 700; font-size: 32px; color: #A21C42; line-height: 1\">4<\u002Fspan>\n                <svg width=\"62\" height=\"62\" sc-camel-view-box=\"0 0 64 64\" aria-hidden=\"true\" style=\"display: block; flex: none\">\n                  <rect x=\"12\" y=\"6\" width=\"38\" height=\"48\" fill=\"#F5D6AE\" stroke=\"#1C1A19\" stroke-width=\"1.5\"><\u002Frect>\n                  <path d=\"M 20 18 L 42 18 M 20 27 L 42 27 M 20 36 L 32 36\" stroke=\"#1C1A19\" stroke-width=\"1.5\"><\u002Fpath>\n                  <path d=\"M 30 44 L 35 49 L 45 38\" fill=\"none\" stroke=\"#A21C42\" stroke-width=\"2.5\"><\u002Fpath>\n                <\u002Fsvg>\n              <\u002Fdiv>\n              <p style=\"font-family: Archivo, sans-serif; font-weight: 700; font-size: 20px; margin: 0 0 6px; letter-spacing: -0.01em\">TOEFL &amp; IELTS Preparation<\u002Fp>\n              <p style=\"margin: 0 0 12px; font-size: 15px; color: #8A7C74\">Butuh skor resmi · 2 bulan intensif, 3× seminggu<\u002Fp>\n              <p style=\"margin: 0; font-size: 16px; line-height: 1.55\">Strategi per section, bank soal, dan dua kali simulasi tes lengkap dengan konsultasi target skor.<\u002Fp>\n            <\u002Fa>\n            <a href=\"#\" sc-camel-on-click=\"{{ goBiz }}\" style=\"border: 1.5px solid #1C1A19; border-radius: 4px; padding: 24px; display: block; color: #1C1A19; transition: background 0.18s ease, border-color 0.18s ease\" style-hover=\"border-color: #A21C42; background: #FDF4E9\">\n              <div style=\"display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 18px\">\n                <span style=\"font-family: Archivo, sans-serif; font-weight: 700; font-size: 32px; color: #A21C42; line-height: 1\">5<\u002Fspan>\n                <svg width=\"62\" height=\"62\" sc-camel-view-box=\"0 0 64 64\" aria-hidden=\"true\" style=\"display: block; flex: none\">\n                  <rect x=\"6\" y=\"22\" width=\"52\" height=\"30\" fill=\"#F5D6AE\" stroke=\"#1C1A19\" stroke-width=\"1.5\"><\u002Frect>\n                  <path d=\"M 24 22 L 24 14 L 40 14 L 40 22\" fill=\"none\" stroke=\"#1C1A19\" stroke-width=\"1.5\"><\u002Fpath>\n                  <path d=\"M 6 34 L 58 34\" stroke=\"#1C1A19\" stroke-width=\"1.5\"><\u002Fpath>\n                <\u002Fsvg>\n              <\u002Fdiv>\n              <p style=\"font-family: Archivo, sans-serif; font-weight: 700; font-size: 20px; margin: 0 0 6px; letter-spacing: -0.01em\">Business English<\u002Fp>\n              <p style=\"margin: 0 0 12px; font-size: 15px; color: #8A7C74\">Karyawan dan profesional · 2 bulan, 2× seminggu<\u002Fp>\n              <p style=\"margin: 0; font-size: 16px; line-height: 1.55\">Email, meeting, presentasi, dan negosiasi. Tersedia kelas malam dan in-house di perusahaan.<\u002Fp>\n            <\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section style=\"background: #A21C42; color: #FFFDFA; border-bottom: 2px solid #1C1A19\">\n        <div style=\"max-width: 1140px; margin: 0 auto; padding: 72px 24px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 64px; align-items: start\">\n          <div>\n            <h2 style=\"font-family: Archivo, sans-serif; font-weight: 700; font-size: clamp(28px, 3.4vw, 44px); line-height: 1.1; letter-spacing: -0.02em; margin: 0 0 32px\">Setelah bahasanya siap, kami bantu urusan berangkatnya<\u002Fh2>\n            <svg sc-camel-view-box=\"0 0 600 290\" width=\"100%\" role=\"img\" aria-label=\"Diagram rute pendampingan dari Batam ke Malaysia, Singapura, Australia, Kanada, dan Selandia Baru\" style=\"display: block; max-width: 520px\">\n              <g fill=\"none\" stroke=\"#F5D6AE\" stroke-width=\"1.5\" stroke-dasharray=\"700\" style=\"animation: hfDraw 1.6s ease-out both\">\n                <path d=\"M 60 240 Q 100 180 170 152\"><\u002Fpath>\n                <path d=\"M 60 240 Q 130 140 260 84\"><\u002Fpath>\n                <path d=\"M 60 240 Q 200 100 400 58\"><\u002Fpath>\n                <path d=\"M 60 240 Q 180 246 320 210\"><\u002Fpath>\n                <path d=\"M 60 240 Q 280 310 470 244\"><\u002Fpath>\n              <\u002Fg>\n              <g fill=\"#F5D6AE\">\n                <circle cx=\"170\" cy=\"152\" r=\"5\"><\u002Fcircle>\n                <circle cx=\"260\" cy=\"84\" r=\"5\"><\u002Fcircle>\n                <circle cx=\"400\" cy=\"58\" r=\"5\"><\u002Fcircle>\n                <circle cx=\"320\" cy=\"210\" r=\"5\"><\u002Fcircle>\n                <circle cx=\"470\" cy=\"244\" r=\"5\"><\u002Fcircle>\n              <\u002Fg>\n              <circle cx=\"60\" cy=\"240\" r=\"9\" fill=\"#F2C230\" stroke=\"#FFFDFA\" stroke-width=\"1.5\"><\u002Fcircle>\n              <g font-family=\"Archivo, sans-serif\" font-size=\"15\" font-weight=\"600\" fill=\"#FFFDFA\">\n                <text x=\"182\" y=\"157\">Singapura<\u002Ftext>\n                <text x=\"272\" y=\"89\">Malaysia<\u002Ftext>\n                <text x=\"412\" y=\"63\">Kanada<\u002Ftext>\n                <text x=\"332\" y=\"215\">Australia<\u002Ftext>\n                <text x=\"482\" y=\"249\">Selandia Baru<\u002Ftext>\n                <text x=\"60\" y=\"272\" fill=\"#F2C230\">Batam<\u002Ftext>\n              <\u002Fg>\n            <\u002Fsvg>\n          <\u002Fdiv>\n          <div>\n            <p style=\"margin: 0 0 20px; color: #F5D6AE; font-size: 18px\">Hanna Filia Overseas Service mendampingi pemilihan kampus, terjemahan dokumen, pengurusan student pass, sampai mencari tempat tinggal di negara tujuan. Malaysia, Singapura, Australia, Kanada, dan Selandia Baru.<\u002Fp>\n            <a href=\"#\" sc-camel-on-click=\"{{ goHfos }}\" style=\"border: 1.5px solid #FFFDFA; color: #FFFDFA; padding: 14px 20px; font-family: Archivo, sans-serif; font-weight: 700; font-size: 16px; display: inline-block\" style-hover=\"background: #8B1230\">Pelajari HFOS<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section style=\"border-bottom: 2px solid #1C1A19\">\n        <div style=\"max-width: 1140px; margin: 0 auto; padding: 72px 24px\">\n          <h2 style=\"font-family: Archivo, sans-serif; font-weight: 700; font-size: 32px; letter-spacing: -0.02em; margin: 0 0 32px\">Kata mereka<\u002Fh2>\n          <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px\">\n            <sc-for list=\"{{ testimoniBeranda }}\" as=\"t\" hint-placeholder-count=\"3\">\n              <blockquote style=\"background: #F5D6AE; padding: 28px; margin: 0\">\n                <p style=\"font-family: Newsreader, Georgia, serif; font-style: italic; font-size: 20px; line-height: 1.5; margin: 0 0 18px\">{{ t.quote }}<\u002Fp>\n                <footer style=\"font-size: 15px; color: #8B1230\"><strong style=\"font-family: Archivo, sans-serif; font-weight: 700\">{{ t.nama }}<\u002Fstrong> · {{ t.peran }}<\u002Ffooter>\n              <\u002Fblockquote>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section>\n        <div style=\"max-width: 1140px; margin: 0 auto; padding: 72px 24px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 64px; align-items: start\">\n          <div>\n            <div style=\"display: inline-block; background: #F2C230; color: #1C1A19; font-family: Archivo, sans-serif; font-weight: 700; font-size: 14px; letter-spacing: 0.06em; text-transform: uppercase; padding: 7px 22px; margin-bottom: 18px; clip-path: polygon(0 0, 100% 0, calc(100% - 11px) 50%, 100% 100%, 0 100%, 11px 50%)\">Gratis<\u002Fdiv>\n            <h2 style=\"font-family: Archivo, sans-serif; font-weight: 700; font-size: clamp(28px, 3.4vw, 44px); line-height: 1.1; letter-spacing: -0.02em; margin: 0 0 18px\">Coba satu kelas dulu, gratis<\u002Fh2>\n            <p style=\"margin: 0; max-width: 52ch\">Datang ke Nagoya Newton, ikut satu sesi, lihat sendiri suasana kelasnya. Tanpa biaya, tanpa kewajiban lanjut.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"border: 1.5px solid #1C1A19; padding: 28px\">\n            <sc-if value=\"{{ sent }}\" hint-placeholder-val=\"{{ false }}\">\n              <div>\n                <p style=\"font-family: Archivo, sans-serif; font-weight: 700; font-size: 24px; margin: 0 0 10px; color: #A21C42; letter-spacing: -0.01em\">Pendaftaran terkirim.<\u002Fp>\n                <p style=\"margin: 0 0 20px\">Kami hubungi lewat WhatsApp dalam 1×24 jam.<\u002Fp>\n                <a href=\"#\" sc-camel-on-click=\"{{ resetForm }}\" style=\"font-family: Archivo, sans-serif; font-weight: 700; font-size: 16px\">Kirim lagi<\u002Fa>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ notSent }}\" hint-placeholder-val=\"{{ true }}\">\n              <form sc-camel-on-submit=\"{{ submit }}\" style=\"display: grid; gap: 16px\">\n                <label style=\"display: grid; gap: 6px; font-size: 15px; font-weight: 600\">Nama\n                  <input type=\"text\" value=\"{{ nama }}\" sc-camel-on-change=\"{{ setNama }}\" placeholder=\"Nama lengkap\" style=\"border: 1.5px solid #1C1A19; background: #FFFDFA; padding: 12px 14px; font-family: 'Source Sans 3', sans-serif; font-size: 17px; font-weight: 400; border-radius: 0\">\n                <\u002Flabel>\n                <label style=\"display: grid; gap: 6px; font-size: 15px; font-weight: 600\">Nomor WhatsApp\n                  <input type=\"tel\" value=\"{{ wa }}\" sc-camel-on-change=\"{{ setWa }}\" placeholder=\"08xx xxxx xxxx\" style=\"border: 1.5px solid #1C1A19; background: #FFFDFA; padding: 12px 14px; font-family: 'Source Sans 3', sans-serif; font-size: 17px; font-weight: 400; border-radius: 0\">\n                <\u002Flabel>\n                <label style=\"display: grid; gap: 6px; font-size: 15px; font-weight: 600\">Program yang diminati\n                  <sc-raw-select value=\"{{ prog }}\" sc-camel-on-change=\"{{ setProg }}\" style=\"border: 1.5px solid #1C1A19; background: #FFFDFA; padding: 12px 14px; font-family: 'Source Sans 3', sans-serif; font-size: 17px; border-radius: 0\">\n                    <sc-for list=\"{{ programNames }}\" as=\"p\" hint-placeholder-count=\"6\">\n                      <option value=\"{{ p }}\">{{ p }}<\u002Foption>\n                    <\u002Fsc-for>\n                  <\u002Fsc-raw-select>\n                <\u002Flabel>\n                <button type=\"submit\" style=\"background: #F2C230; color: #1C1A19; border: 1.5px solid #1C1A19; padding: 14px 20px; font-family: Archivo, sans-serif; font-weight: 700; font-size: 17px; cursor: pointer; border-radius: 0; text-align: left\" style-hover=\"background: #A21C42; color: #FFFDFA\">Daftar kelas percobaan<\u002Fbutton>\n              <\u002Fform>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fmain>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isTentang }}\" hint-placeholder-val=\"{{ false }}\">\n    <main>\n      <section style=\"background: #A21C42; color: #FFFDFA; border-bottom: 2px solid #1C1A19\">\n        <div style=\"max-width: 1140px; margin: 0 auto; padding: 64px 24px\">\n          <p style=\"font-family: Archivo, sans-serif; font-weight: 700; font-size: 13px; letter-spacing: 0.09em; text-transform: uppercase; color: #F5D6AE; margin: 0 0 14px\">Tentang kami<\u002Fp>\n          <h1 style=\"font-family: Archivo, sans-serif; font-weight: 700; font-size: clamp(32px, 4.4vw, 56px); line-height: 1.06; letter-spacing: -0.02em; margin: 0; max-width: 22ch\">Dua dekade mengajar orang Batam bicara<\u002Fh1>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section style=\"border-bottom: 2px solid #1C1A19\">\n        <div style=\"max-width: 1140px; margin: 0 auto; padding: 64px 24px; display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 56px; align-items: start\">\n          <div style=\"max-width: 68ch\">\n            <p style=\"margin: 0 0 20px\">Hanna Filia mulai tahun 2003 dari satu ruko di Nagoya dengan dua kelas dan tiga belas siswa. Waktu itu Batam sedang tumbuh cepat — pabrik-pabrik baru buka, orang datang dari seluruh Indonesia, dan hampir semua pekerjaan bagus mensyaratkan bahasa Inggris.<\u002Fp>\n            <p style=\"margin: 0 0 20px\">Ibu Anna, S.Pd. mendirikan Hanna Filia karena melihat celah yang sama berulang: orang bisa lulus ujian bahasa Inggris tapi diam waktu diajak bicara. Sejak awal kelas di sini dibuat kecil dan banyak bicara.<\u002Fp>\n            <p style=\"margin: 0\">Dua dekade kemudian, kami sudah mengajar lebih dari empat ribu siswa, dari anak kelas satu SD sampai insinyur yang mau pindah kerja ke Singapura. Sebagian dari mereka kami antar sampai ke kampus di luar negeri lewat layanan HFOS.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"border: 1.5px solid #1C1A19; background: #F5D6AE; aspect-ratio: 4 / 3; display: flex; align-items: end; padding: 16px\">\n            <p style=\"margin: 0; font-family: Archivo, sans-serif; font-weight: 700; font-size: 15px; color: #8B1230\">Foto tampak depan gedung Nagoya Newton — 4:3<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section style=\"background: #F5D6AE; border-bottom: 2px solid #1C1A19\">\n        <div style=\"max-width: 1140px; margin: 0 auto; padding: 64px 24px\">\n          <p style=\"font-family: Archivo, sans-serif; font-weight: 700; font-size: 13px; letter-spacing: 0.09em; text-transform: uppercase; color: #8B1230; margin: 0 0 16px\">Visi<\u002Fp>\n          <p style=\"font-family: Newsreader, Georgia, serif; font-style: italic; font-size: clamp(24px, 3vw, 32px); line-height: 1.4; margin: 0; max-width: 40ch\">Menjadi lembaga bahasa Inggris yang membuat orang Batam berani bicara di mana pun mereka berdiri.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section style=\"border-bottom: 2px solid #1C1A19\">\n        <div style=\"max-width: 1140px; margin: 0 auto; padding: 64px 24px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 56px; align-items: start\">\n          <div>\n            <h2 style=\"font-family: Archivo, sans-serif; font-weight: 700; font-size: 24px; letter-spacing: -0.01em; margin: 0 0 20px\">Misi<\u002Fh2>\n            <sc-for list=\"{{ misi }}\" as=\"m\" hint-placeholder-count=\"4\">\n              <p style=\"margin: 0; padding: 16px 0; border-top: 1.5px solid rgba(28, 26, 25, 0.18)\">{{ m }}<\u002Fp>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div>\n            <h2 style=\"font-family: Archivo, sans-serif; font-weight: 700; font-size: 24px; letter-spacing: -0.01em; margin: 0 0 20px\">Nilai<\u002Fh2>\n            <sc-for list=\"{{ nilai }}\" as=\"n\" hint-placeholder-count=\"4\">\n              <div style=\"padding: 16px 0; border-top: 1.5px solid rgba(28, 26, 25, 0.18)\">\n                <p style=\"font-family: Archivo, sans-serif; font-weight: 700; font-size: 18px; margin: 0 0 4px; color: #A21C42\">{{ n.judul }}<\u002Fp>\n                <p style=\"margin: 0; font-size: 16px\">{{ n.isi }}<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section>\n        <div style=\"max-width: 1140px; margin: 0 auto; padding: 64px 24px\">\n          <h2 style=\"font-family: Archivo, sans-serif; font-weight: 700; font-size: 24px; letter-spacing: -0.01em; margin: 0 0 24px\">Fasilitas<\u002Fh2>\n          <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 0 24px\">\n            <sc-for list=\"{{ fasilitas }}\" as=\"f\" hint-placeholder-count=\"6\">\n              <p style=\"margin: 0; padding: 14px 0; border-top: 1.5px solid rgba(28, 26, 25, 0.18); font-size: 16px\">{{ f }}<\u002Fp>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fmain>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isProgram }}\" hint-placeholder-val=\"{{ false }}\">\n    <main>\n      <section style=\"background: #A21C42; color: #FFFDFA; border-bottom: 2px solid #1C1A19\">\n        <div style=\"max-width: 1140px; margin: 0 auto; padding: 64px 24px\">\n          <p style=\"font-family: Archivo, sans-serif; font-weight: 700; font-size: 13px; letter-spacing: 0.09em; text-transform: uppercase; color: #F5D6AE; margin: 0 0 14px\">Program kursus<\u002Fp>\n          <h1 style=\"font-family: Archivo, sans-serif; font-weight: 700; font-size: clamp(32px, 4.4vw, 56px); line-height: 1.06; letter-spacing: -0.02em; margin: 0 0 18px; max-width: 24ch\">Lima level, berurutan dari kata pertama<\u002Fh1>\n          <p style=\"margin: 0; max-width: 56ch; color: #F5D6AE; font-size: 18px\">Tes penempatan gratis menentukan Anda mulai dari mana. Satu sesi percobaan gratis sebelum mendaftar.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section style=\"border-bottom: 2px solid #1C1A19\">\n        <div style=\"max-width: 1140px; margin: 0 auto; padding: 0 24px\">\n          <sc-for list=\"{{ levels }}\" as=\"lv\" hint-placeholder-count=\"5\">\n            <a href=\"#\" sc-camel-on-click=\"{{ lv.open }}\" style=\"display: grid; grid-template-columns: 72px minmax(0, 1.1fr) minmax(0, 1fr) auto; gap: 28px; align-items: center; padding: 32px 0; border-bottom: 1.5px solid rgba(28, 26, 25, 0.18); color: #1C1A19\" style-hover=\"background: #FDF4E9\">\n              <span style=\"font-family: Archivo, sans-serif; font-weight: 700; font-size: 44px; color: #A21C42; line-height: 1\">{{ lv.n }}<\u002Fspan>\n              <span>\n                <span style=\"font-family: Archivo, sans-serif; font-weight: 700; font-size: 24px; letter-spacing: -0.01em; display: block\">{{ lv.name }}<\u002Fspan>\n                <span style=\"font-size: 15px; color: #8A7C74\">{{ lv.untuk }}<\u002Fspan>\n              <\u002Fspan>\n              <span style=\"font-size: 16px; line-height: 1.55\">{{ lv.ringkas }}<\u002Fspan>\n              <span style=\"font-family: Archivo, sans-serif; font-weight: 700; font-size: 15px; color: #A21C42; text-align: right\">{{ lv.biayaLabel }}<\u002Fspan>\n            <\u002Fa>\n          <\u002Fsc-for>\n          <a href=\"#\" sc-camel-on-click=\"{{ goHfos }}\" style=\"display: grid; grid-template-columns: 72px minmax(0, 1.1fr) minmax(0, 1fr) auto; gap: 28px; align-items: center; padding: 32px 0; color: #1C1A19\" style-hover=\"background: #FDF4E9\">\n            <span style=\"font-family: Archivo, sans-serif; font-weight: 700; font-size: 44px; color: #F2C230; line-height: 1\">6<\u002Fspan>\n            <span>\n              <span style=\"font-family: Archivo, sans-serif; font-weight: 700; font-size: 24px; letter-spacing: -0.01em; display: block\">Studi ke Luar Negeri<\u002Fspan>\n              <span style=\"font-size: 15px; color: #8A7C74\">Hanna Filia Overseas Service<\u002Fspan>\n            <\u002Fspan>\n            <span style=\"font-size: 16px; line-height: 1.55\">Pemilihan kampus, terjemahan dokumen, visa dan student pass, sampai tempat tinggal di negara tujuan.<\u002Fspan>\n            <span style=\"font-family: Archivo, sans-serif; font-weight: 700; font-size: 15px; color: #A21C42; text-align: right\">Konsultasi<\u002Fspan>\n          <\u002Fa>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section>\n        <div style=\"max-width: 1140px; margin: 0 auto; padding: 56px 24px\">\n          <h2 style=\"font-family: Archivo, sans-serif; font-weight: 700; font-size: 24px; margin: 0 0 20px; letter-spacing: -0.01em\">Berlaku untuk semua program<\u002Fh2>\n          <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 0 24px\">\n            <sc-for list=\"{{ lintasProgram }}\" as=\"c\" hint-placeholder-count=\"4\">\n              <p style=\"margin: 0; padding: 14px 0; border-top: 1.5px solid rgba(28, 26, 25, 0.18); font-size: 16px\">{{ c }}<\u002Fp>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fmain>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ detail }}\" hint-placeholder-val=\"{{ false }}\">\n    <main>\n      <section style=\"background: #A21C42; color: #FFFDFA; border-bottom: 2px solid #1C1A19\">\n        <div style=\"max-width: 1140px; margin: 0 auto; padding: 56px 24px 64px\">\n          <a href=\"#\" sc-camel-on-click=\"{{ goProgram }}\" style=\"color: #F5D6AE; font-size: 15px; font-family: Archivo, sans-serif; font-weight: 600; display: block; width: fit-content; margin-bottom: 24px\">Semua program<\u002Fa>\n          <div style=\"display: inline-block; background: #F2C230; color: #1C1A19; font-family: Archivo, sans-serif; font-weight: 700; font-size: 14px; letter-spacing: 0.06em; text-transform: uppercase; padding: 7px 24px; margin-bottom: 18px; clip-path: polygon(0 0, 100% 0, calc(100% - 11px) 50%, 100% 100%, 0 100%, 11px 50%)\">Level {{ detail.n }}<\u002Fdiv>\n          <h1 style=\"font-family: Archivo, sans-serif; font-weight: 700; font-size: clamp(32px, 4.4vw, 56px); line-height: 1.06; letter-spacing: -0.02em; margin: 0 0 16px\">{{ detail.name }}<\u002Fh1>\n          <p style=\"margin: 0; AE; aspect-ratio: 4 / 3; display: flex; align-items: end; padding: 16px\">\n              <p style=\"margin: 0; font-family: Archivo, sans-serif; font-weight: 700; font-size: 15px; color: #8B1230\">{{ detail.fotoLabel }}<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section>\n        <div style=\"max-width: 1140px; margin: 0 auto; padding: 56px 24px; display: flex; gap: 32px; align-items: center; justify-content: space-between; flex-wrap: wrap\">\n          <div>\n            <p style=\"font-family: Archivo, sans-serif; font-weight: 700; font-size: 28px; margin: 0 0 6px; letter-spacing: -0.02em\">Coba satu sesi dulu<\u002Fp>\n            <p style=\"margin: 0; color: #8A7C74\">Tes penempatan gratis, tanpa kewajiban lanjut.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display: flex; gap: 12px; flex-wrap: wrap\">\n            <a href=\"#\" sc-camel-on-click=\"{{ goKontak }}\" style=\"background: #F2C230; color: #1C1A19; border: 1.5px solid #1C1A19; padding: 14px 20px; font-family: Archivo, sans-serif; font-weight: 700; font-size: 16px\" style-hover=\"background: #A21C42; color: #FFFDFA\">Daftar kelas percobaan<\u002Fa>\n            <a href=\"#\" sc-camel-on-click=\"{{ goKontak }}\" style=\"border: 1.5px solid #1C1A19; color: #1C1A19; padding: 14px 20px; font-family: Archivo, sans-serif; font-weight: 700; font-size: 16px\" style-hover=\"background: #F5D6AE\">Tanya biaya<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fmain>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isHfos }}\" hint-placeholder-val=\"{{ false }}\">\n    <main>\n      <section style=\"background: #A21C42; color: #FFFDFA; border-bottom: 2px solid #1C1A19\">\n        <div style=\"max-width: 1140px; margin: 0 auto; padding: 64px 24px\">\n          <p style=\"font-family: Archivo, sans-serif; font-weight: 700; font-size: 13px; letter-spacing: 0.09em; text-transform: uppercase; color: #F5D6AE; margin: 0 0 14px\">HFOS<\u002Fp>\n          <h1 style=\"font-family: Archivo, sans-serif; font-weight: 700; font-size: clamp(32px, 4.4vw, 56px); line-height: 1.06; letter-spacing: -0.02em; margin: 0 0 24px\">Hanna Filia Overseas Service<\u002Fh1>\n          <p style=\"font-family: Newsreader, Georgia, serif; font-style: italic; font-size: clamp(20px, 2.4vw, 28px); line-height: 1.45; margin: 0; max-width: 44ch; color: #F5D6AE\">Mengurus kuliah di luar negeri itu bukan satu langkah, tapi belasan. Kami sudah melewatinya bersama puluhan keluarga Batam.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section style=\"border-bottom: 2px solid #1C1A19\">\n        <div style=\"max-width: 1140px; margin: 0 auto; padding: 64px 24px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 56px; align-items: start\">\n          <div>\n            <h2 style=\"font-family: Archivo, sans-serif; font-weight: 700; font-size: 24px; margin: 0 0 20px; letter-spacing: -0.01em\">Layanan<\u002Fh2>\n            <sc-for list=\"{{ hfosLayanan }}\" as=\"l\" hint-placeholder-count=\"5\">\n              <p style=\"margin: 0; padding: 15px 0; border-top: 1.5px solid rgba(28, 26, 25, 0.18); font-size: 17px\">{{ l }}<\u002Fp>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div>\n            <h2 style=\"font-family: Archivo, sans-serif; font-weight: 700; font-size: 24px; margin: 0 0 20px; letter-spacing: -0.01em\">Negara tujuan<\u002Fh2>\n            <div style=\"display: flex; flex-wrap: wrap; gap: 10px\">\n              <sc-for list=\"{{ hfosNegara }}\" as=\"n\" hint-placeholder-count=\"7\">\n                <span style=\"border: 1.5px solid #1C1A19; padding: 9px 14px; font-family: Archivo, sans-serif; font-weight: 600; font-size: 16px\">{{ n }}<\u002Fspan>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section style=\"border-bottom: 2px solid #1C1A19\">\n        <div style=\"max-width: 1140px; margin: 0 auto; padding: 64px 24px\">\n          <h2 style=\"font-family: Archivo, sans-serif; font-weight: 700; font-size: 32px; margin: 0 0 40px; letter-spacing: -0.02em\">Alur pendampingan<\u002Fh2>\n          <div style=\"border-left: 2px solid #A21C42; margin-left: 7px\">\n            <sc-for list=\"{{ hfosAlur }}\" as=\"a\" hint-placeholder-count=\"6\">\n              <div style=\"position: relative; padding: 0 0 36px 34px\">\n                <span style=\"position: absolute; left: -9px; top: 6px; width: 16px; height: 16px; background: #A21C42; border-radius: 50%\"><\u002Fspan>\n                <p style=\"font-family: Archivo, sans-serif; font-weight: 700; font-size: 13px; letter-spacing: 0.09em; text-transform: uppercase; color: #8A7C74; margin: 0 0 6px\">Langkah {{ a.n }}<\u002Fp>\n                <p style=\"font-family: Archivo, sans-serif; font-weight: 700; font-size: 20px; margin: 0 0 6px; letter-spacing: -0.01em\">{{ a.judul }}<\u002Fp>\n                <p style=\"margin: 0; max-width: 60ch\">{{ a.isi }}<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section>\n        <div style=\"max-width: 1140px; margin: 0 auto; padding: 56px 24px; display: flex; gap: 32px; align-items: center; justify-content: space-between; flex-wrap: wrap\">\n          <blockquote style=\"margin: 0; background: #F5D6AE; padding: 24px; max-width: 52ch\">\n            <p style=\"font-family: Newsreader, Georgia, serif; font-style: italic; font-size: 20px; line-height: 1.5; margin: 0 0 14px\">Kami sekeluarga nggak ngerti apa-apa soal kuliah di Australia. Bu Sri yang urus dari nyari kampus sampai anak saya dapat kamar di Melbourne.<\u002Fp>\n            <footer style=\"font-size: 15px; color: #8B1230\"><strong style=\"font-family: Archivo, sans-serif; font-weight: 700\">Keluarga Tanuwijaya<\u002Fstrong> · klien HFOS<\u002Ffooter>\n          <\u002Fblockquote>\n : 24ch\">Catatan dari ruang kelas<\u002Fh1>\n          <p style=\"margin: 0; color: #F5D6AE; font-size: 18px; max-width: 52ch\">Bagian ini disiapkan untuk fase dua. Tiga judul di bawah menunjukkan bentuk halamannya.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsection>\n      <section>\n        <div style=\"max-width: 1140px; margin: 0 auto; padding: 64px 24px; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px\">\n          <sc-for list=\"{{ artikel }}\" as=\"a\" hint-placeholder-count=\"3\">\n            <div style=\"border: 1.5px solid #1C1A19; border-radius: 4px\">\n              <div style=\"background: #F5D6AE; aspect-ratio: 16 / 9; border-bottom: 1.5px solid #1C1A19; display: flex; align-items: end; padding: 14px\">\n                <p style=\"margin: 0; font-family: Archivo, sans-serif; font-weight: 700; font-size: 14px; color: #8B1230\">Gambar artikel — 16:9<\u002Fp>\n              <\u002Fdiv>\n              <div style=\"padding: 22px\">\n                <p style=\"font-family: Archivo, sans-serif; font-weight: 700; font-size: 13px; letter-spacing: 0.09em; text-transform: uppercase; color: #8A7C74; margin: 0 0 10px\">{{ a.kategori }}<\u002Fp>\n                <p style=\"font-family: Archivo, sans-serif; font-weight: 700; font-size: 20px; margin: 0 0 8px; letter-spacing: -0.01em; line-height: 1.25\">{{ a.judul }}<\u002Fp>\n                <p style=\"margin: 0; font-size: 16px; color: #8A7C74\">{{ a.tanggal }}<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fmain>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isKontak }}\" hint-placeholder-val=\"{{ false }}\">\n    <main>\n      <section style=\"background: #A21C42; color: #FFFDFA; border-bottom: 2px solid #1C1A19\">\n        <div style=\"max-width: 1140px; margin: 0 auto; padding: 64px 24px\">\n          <p style=\"font-family: Archivo, sans-serif; font-weight: 700; font-size: 13px; letter-spacing: 0.09em; text-transform: uppercase; color: #F5D6AE; margin: 0 0 14px\">Kontak &amp; pendaftaran<\u002Fp>\n          <h1 style=\"font-family: Archivo, sans-serif; font-weight: 700; font-size: clamp(32px, 4.4vw, 56px); line-height: 1.06; letter-spacing: -0.02em; margin: 0\">Datang ke Nagoya Newton<\u002Fh1>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section style=\"border-bottom: 2px solid #1C1A19\">\n        <div style=\"max-width: 1140px; margin: 0 auto; padding: 64px 24px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 56px; align-items: start\">\n          <div>\n            <h2 style=\"font-family: Archivo, sans-serif; font-weight: 700; font-size: 24px; margin: 0 0 20px; letter-spacing: -0.01em\">Alamat<\u002Fh2>\n            <p style=\"margin: 0 0 28px\">Komplek Nagoya Newton Blok C No. 15–17<br>Lubuk Baja Kota, Kec. Lubuk Baja<br>Kota Batam, Kepulauan Riau 29432<\u002Fp>\n            <sc-for list=\"{{ kontakBaris }}\" as=\"k\" hint-placeholder-count=\"4\">\n              <div style=\"display: flex; gap: 16px; padding: 13px 0; border-top: 1.5px solid rgba(28, 26, 25, 0.18)\">\n                <span style=\"font-size: 15px; color: #8A7C74; width: 110px; flex: none\">{{ k.label }}<\u002Fspan>\n                <span style=\"font-weight: 600\">{{ k.value }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <h2 style=\"font-family: Archivo, sans-serif; font-weight: 700; font-size: 24px; margin: 36px 0 20px; letter-spacing: -0.01em\">Jam operasional<\u002Fh2>\n            <sc-for list=\"{{ jam }}\" as=\"j\" hint-placeholder-count=\"3\">\n              <div style=\"display: flex; gap: 16px; padding: 13px 0; border-top: 1.5px solid rgba(28, 26, 25, 0.18)\">\n                <span style=\"font-size: 15px; color: #8A7C74; width: 110px; flex: none\">{{ j.hari }}<\u002Fspan>\n                <span style=\"font-weight: 600\">{{ j.buka }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc  end; padding: 16px\">\n              <p style=\"margin: 0; font-family: Archivo, sans-serif; font-weight: 700; font-size: 15px; color: #8B1230\">Peta Google Maps — titik Nagoya Newton<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section>\n        <div style=\"max-width: 1140px; margin: 0 auto; padding: 64px 24px\">\n          <h2 style=\"font-family: Archivo, sans-serif; font-weight: 700; font-size: 32px; margin: 0 0 28px; letter-spacing: -0.02em\">Pertanyaan yang sering masuk<\u002Fh2>\n          <div style=\"max-width: 800px\">\n            <sc-for list=\"{{ faq }}\" as=\"f\" hint-placeholder-count=\"7\">\n              <div style=\"border-top: 1.5px solid rgba(28, 26, 25, 0.18)\">\n                <a href=\"#\" sc-camel-on-click=\"{{ f.toggle }}\" style=\"display: flex; gap: 20px; align-items: baseline; justify-content: space-between; padding: 18px 0; color: #1C1A19; font-family: Archivo, sans-serif; font-weight: 700; font-size: 19px\" style-hover=\"color: #A21C42\">\n                  <span>{{ f.q }}<\u002Fspan>\n                  <span style=\"color: #A21C42; font-size: 24px; line-height: 1; flex: none\">{{ f.sign }}<\u002Fspan>\n                <\u002Fa>\n                <sc-if value=\"{{ f.open }}\" hint-placeholder-val=\"{{ false }}\">\n                  <p style=\"margin: 0; padding: 0 0 22px; max-width: 68ch\">{{ f.a }}<\u002Fp>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fmain>\n  <\u002Fsc-if>\n\n  <footer style=\"background: #A21C42; color: #FFFDFA; border-top: 2px solid #1C1A19\">\n    <div style=\"max-width: 1140px; margin: 0 auto; padding: 64px 24px 32px; display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr) minmax(0, 1fr); gap: 48px; align-items: start\">\n      <div>\n        <p style=\"font-family: Archivo, sans-serif; font-weight: 700; font-size: fy-content: space-between; flex-wrap: wrap; font-size: 14px; color: #F5D6AE\">\n      <span>NILEK / NPSN — menunggu data · Akreditasi BAN PAUD &amp; PNF — menunggu data<\u002Fspan>\n      <span>© 2026 Yayasan Hanna Filia Internasional<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Ffooter>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;tampilkanHarga&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Konten&quot;,&quot;label&quot;:&quot;Tampilkan harga program&quot;}}\">\nclass Component extends DCLogic {\n  state = {\n    route: \"beranda\", level: 2, pick: -1, faq: -1, gal: \"Semua\",\n    sent: false, nama: \"\", wa: \"\", usia: \"\", prog: \"\", pesan: \"\", p: 0\n  };\n\n  componentDidMount() {\n    const t0 = performance.now();\n    const tick = () => {\n      const p = Math.min(1, (performance.now() - t0) / 1100);\n      this.setState({ p });\n      if (p < 1) this._raf = requestAnimationFrame(tick);\n    };\n    this._raf = requestAnimationFrame(tick);\n  }\n\n  componentWillUnmount() {\n    if (this._raf) cancelAnimationFrame(this._raf);\n  }\n\n  go(route) {\n    return (e) => {\n      if (e && e.preventDefault) e.preventDefault();\n      this.setState({ route, pick: -1 });\n      if (typeof window !== \"undefined\") window.scrollTo(0, 0);\n    };\n  }\n\n  data() {\n    return [\n      {\n        n: 1, slug: \"kids\", name: \"English for Kids\", untuk: \"Usia 6–12 tahun\",\n        durasi: \"3 bulan\", jadwal: \"2× seminggu\", menit: \"60 menit\",\n        ringkas: \"Kosakata sehari-hari, phonics, dan percakapan dasar lewat lagu, permainan, dan cerita pendek.\",\n        isi: [\"Kosakata sehari-hari\", \"Phonics\", \"Lagu dan permainan\", \"Membaca cerita pendek\", \"Percakapan dasar\"],\n        hasil: \"Anak bisa memperkenalkan diri, bercerita tentang keseharian, dan membaca teks pendek.\",\n        harga: \"Rp 650.000 / bulan\", fotoLabel: \"Foto kelas Kids — 4:3\"\n      },\n      {\n        n: 2, slug: \"teens\", name: \"English for Teens\", untuk: \"Siswa SMP & SMA\",\n        durasi: \"3 bulan\", jadwal: \"2× seminggu\", menit: \"90 menit\",\n        ringkas: \"Grammar terstruktur, writing, dan presentasi, dengan latihan soal sekolah dan diskusi topik remaja.\",\n        isi: [\"Grammar terstruktur\", \"Writing\", \"Presentasi\", \"Latihan soal sekolah\", \"Diskusi topik remaja\"],\n        hasil: \"Nilai sekolah naik dan siap ikut tes bahasa tingkat dasar.\",\n        harga: \"Rp 750.000 / bulan\", fotoLabel: \"Foto kelas Teens — 4:3\"\n      },\n      {\n        n: 3, slug: \"conversation\", name: \"Conversation Class\", untuk: \"Umum, 15 tahun ke atas\",\n        durasi: \"3 bulan\", jadwal: \"2× seminggu\", menit: \"90 menit\",\n        ringkas: \"Percakapan tematik dan roleplay situasi nyata, dengan sesi bulanan bersama pengajar native speaker.\",\n        isi: [\"Percakapan tematik\", \"Roleplay situasi nyata\", \"Pelafalan\", \"Sesi bulanan dengan pengajar native speaker\"],\n        hasil: \"Berani bicara spontan dalam situasi kerja dan sehari-hari.\",\n        harga: \"Rp 850.000 / bulan\", fotoLabel: \"Foto kelas Conversation — 4:3\"\n      },\n      {\n        n: 4, slug: \"toefl-ielts\", name: \"TOEFL & IELTS Preparation\", untuk: \"Pelajar, mahasiswa, dan pekerja yang butuh skor resmi\",\n        durasi: \"2 bulan intensif\", jadwal: \"3× seminggu\", menit: \"90 menit\",\n        ringkas: \"Strategi per section, bank soal, dan dua kali simulasi tes lengkap dengan konsultasi target skor.\",\n        isi: [\"Strategi per section\", \"Bank soal\", \"Dua kali simulasi tes lengkap\", \"Konsultasi target skor\"],\n        hasil: \"Peningkatan skor rata-rata 60 poin TOEFL ITP.\",\n        harga: \"Rp 2.400.000 / paket\", fotoLabel: \"Foto kelas persiapan tes — 4:3\"\n      },\n      {\n        n: 5, slug: \"business\", name: \"Business English\", untuk: \"Karyawan dan profesional\",\n        durasi: \"2 bulan\", jadwal: \"2× seminggu\", menit: \"90 menit\",\n        ringkas: \"Email, meeting, presentasi, dan negosiasi. Tersedia kelas malam dan in-house di perusahaan.\",\n        isi: [\"Email dan korespondensi\", \"Meeting\", \"Presentasi\", \"Negosiasi\", \"Istilah industri\"],\n        hasil: \"Mampu memimpin rapat dan menulis korespondensi kerja dalam bahasa Inggris.\",\n        harga: \"Rp 1.100.000 / bulan · in-house dihitung per perusahaan\", fotoLabel: \"Foto kelas Business — 4:3\"\n      }\n    ];\n  }\n\n  renderVals() {\n    const st = this.state;\n    const tampilHarga = this.props.tampilkanHarga ?? false;\n    const raw = this.data();\n    const routes = [\"beranda\", \"tentang\", \"program\", \"hfos\", \"pengajar\", \"kontak\", \"galeri\", \"artikel\"];\n    const detailSlug = routes.indexOf(st.route) === -1 ? st.route : null;\n\n    const levels = raw.map((lv, i) => {\n      const on = i === st.level;\n      return {\n        n: lv.n, name: lv.name, untuk: lv.untuk, ringkas: lv.ringkas,\n        short: [\"English for Kids\", \"English for Teens\", \"Conversation\", \"TOEFL & IELTS\", \"Business English\"][i],\n        meta: [\"6–12 th\", \"SMP–SMA\", \"15 th +\", \"Intensif\", \"Profesional\"][i],\n        durasiSingkat: lv.durasi + \", \" + lv.jadwal,\n        biayaLabel: tampilHarga ? lv.harga.split(\" · \")[0] : \"Tanya biaya\",\n        open: this.go(lv.slug),\n        hover: () => this.setState({ level: i }),\n        rowStyle: \"display: flex; align-items: center; gap: 12px; padding: 15px 20px; color: #FFFDFA; cursor: pointer; animation: hfRise 0.5s cubic-bezier(0.2, 0.7, 0.3, 1) both; animation-delay: \" + (0.12 + i * 0.08) + \"s\" + (i ? \"; border-top: 1.5px solid rgba(245, 214, 174, 0.55)\" : \"\"),\n        barStyle: \"display: block; height: 13px; width: \" + (14 + i * 8) + \"px; border: 1.5px solid #F5D6AE; transform-origin: left; animation: hfStep 0.45s cubic-bezier(0.2, 0.7, 0.3, 1) both; animation-delay: \" + (0
